<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#171a24"><title>SMMWE Level Editor</title><link rel="stylesheet" href="./style.css"></head>
<body>
<header><div class="brand">SMMWE <small>LEVEL EDITOR</small></div><nav><button id="new">新建</button><button id="open">打开</button><button id="save" class="primary">保存工程</button><button id="exportSwe" disabled title="导入真实关卡并确认字段映射后开放">导出 .swe</button><input id="file" type="file" accept=".smmweproj,.json,.swe" hidden></nav></header>
<main>
<aside class="panel tools"><h2>工具</h2><button data-tool="paint" class="tool selected">画笔</button><button data-tool="erase" class="tool">橡皮擦</button><button data-tool="select" class="tool">选择 / 平移</button><hr><h2>图块</h2><div id="palette"></div><p class="hint">带“占位”标记的图块仅用于工程草图，不代表已确认的游戏对象 ID。</p></aside>
<section class="editor"><div class="bar"><button id="undo">↶ 撤销</button><button id="redo">↷ 重做</button><button id="minus">−</button><span id="zoom">100%</span><button id="plus">＋</button><span id="status">就绪</span></div><div id="viewport"><canvas id="board"></canvas></div><footer>点击或拖动放置图块 · 滚轮缩放 · 选择工具拖动平移 · 空格 + 拖动平移</footer></section>
<aside class="panel properties"><h2>关卡信息</h2><label>关卡名称<input id="name" value="Untitled Level"></label><label>作者<input id="author"></label><label>简介<textarea id="description" rows="4"></textarea></label><label>标签（逗号分隔）<input id="tags"></label><hr><h2>地图尺寸</h2><label>宽度（格）<input id="width" type="number" min="1" max="500" value="80"></label><label>高度（格）<input id="height" type="number" min="1" max="100" value="15"></label><label>格子像素<input id="tileSize" type="number" min="8" max="64" value="32"></label><button id="resize">应用尺寸</button><hr><h2>SWE 文件</h2><div id="sweInfo" class="notice">可检查候选容器摘要并读取 JSON。尚未确认的游戏对象字段不会被自动改写。</div></aside>
</main><script type="module" src="./app.js"></script></body></html>
