name: Android APK
permissions:
  actions: write
  contents: read
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'web/**'
      - 'core/**'
      - 'tests/**'
      - '.github/workflows/android.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Configure preinstalled Android SDK
        shell: bash
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "Android sdkmanager was not found under $SDK_ROOT/cmdline-tools" >&2
            exit 1
          fi
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-34' 'build-tools;34.0.0' 'platform-tools'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'
      - name: Check JavaScript and SWE round-trip
        run: |
          node --input-type=module --check < web/app.js
          node --input-type=module --check < core/swe.js
          node tests/swe-roundtrip.mjs
      - name: Package shared editor assets
        run: sh android/sync-web-assets.sh
      - name: Build APK
        run: gradle -p android assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: SMMWE-Level-Editor-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Keep only this successful build in Actions history
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const keep = Number(process.env.GITHUB_RUN_ID);
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );
            for (const run of runs) {
              if (run.id === keep) continue;
              await github.rest.actions.deleteWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id
              });
              core.info(`Deleted old run ${run.id} (${run.name})`);
            }
